name: CI / CD

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: ["**"]          # lint + test on every branch push
  pull_request:
    branches: [main]          # lint + test on all PRs targeting main

# ── Shared config ─────────────────────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.11"

# ══════════════════════════════════════════════════════════════════════════════
jobs:

  # ── 1. Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install --quiet "ruff==0.4.9"

      - name: Check code style
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  # ── 2. Test ──────────────────────────────────────────────────────────────────
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobsignals
          POSTGRES_PASSWORD: jobsignals_test
          POSTGRES_DB: jobsignals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://jobsignals:jobsignals_test@localhost:5432/jobsignals_test
      # LLM key injected from GitHub secrets — tests that call Groq will be skipped
      # if the secret is not set (secrets are not passed to forks for security)
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt pytest pytest-asyncio httpx

      - name: Apply database schema
        run: psql "$DATABASE_URL" -f db/schema.sql
        env:
          DATABASE_URL: postgresql://jobsignals:jobsignals_test@localhost:5432/jobsignals_test

      - name: Seed test data
        run: python -m scripts.seed_data 50

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # Deploy: no separate job here — Vercel deploys on push via its own GitHub
  # integration (see the "Vercel" check on commits/PRs), not through this workflow.
  # A prior "Deploy to Railway" job was removed: RAILWAY_DEPLOY_HOOK_URL was never
  # set as a repo secret, so it had been failing on every push since Railway was
  # dropped in favor of Vercel (see 63d3d62, c07b38c).
